name: Build All Firmware

# IMPORTANT: Keep CI targets in sync with firmware/Makefile!
# When adding/removing firmware targets, update both:
# - .github/workflows/build.yml (this file)
# - firmware/Makefile (build and flash targets)
#
# Current STM32 targets (Rust + embassy):
# - pulsardew (STM32G0B1KBU6, thumbv6m-none-eabi)
# - crunchdefender (STM32F405RGT6, thumbv7em-none-eabihf)
#
# Current ESP32-S3 targets (Rust + esp-idf-svc):
# - pulsardewpro (ESP32-S3-MINI-1, xtensa-esp32s3-espidf)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  shared:
    name: Shared library (tests, fmt, clippy)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/shared

      - name: Check formatting
        working-directory: firmware/shared
        run: cargo fmt --check

      - name: Clippy
        working-directory: firmware/shared
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        working-directory: firmware/shared
        run: cargo test

  build-stm32:
    name: Build STM32 ${{ matrix.project }} (${{ matrix.mcu }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - project: pulsardew
            mcu: G0B1
            target: thumbv6m-none-eabi
          - project: crunchdefender
            mcu: F405
            target: thumbv7em-none-eabihf

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/${{ matrix.project }}

      # arm-none-eabi-size / -objcopy, for the size report and the .bin/.hex.
      - name: Install binutils
        run: sudo apt-get update && sudo apt-get install -y binutils-arm-none-eabi

      - name: Check formatting
        working-directory: firmware/${{ matrix.project }}
        run: cargo fmt --check

      - name: Clippy
        working-directory: firmware/${{ matrix.project }}
        run: cargo clippy --release -- -D warnings

      - name: Build firmware
        working-directory: firmware/${{ matrix.project }}
        run: cargo build --release

      - name: Display build info
        working-directory: firmware/${{ matrix.project }}
        run: |
          ELF=target/${{ matrix.target }}/release/${{ matrix.project }}
          arm-none-eabi-objcopy -O binary "$ELF" "$ELF.bin"
          arm-none-eabi-objcopy -O ihex "$ELF" "$ELF.hex"
          arm-none-eabi-size "$ELF"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.project }}-firmware
          path: |
            firmware/${{ matrix.project }}/target/${{ matrix.target }}/release/${{ matrix.project }}
            firmware/${{ matrix.project }}/target/${{ matrix.target }}/release/${{ matrix.project }}.bin
            firmware/${{ matrix.project }}/target/${{ matrix.target }}/release/${{ matrix.project }}.hex
          retention-days: 30

  build-esp32s3-pulsardewpro:
    name: Build ESP32-S3 PulsarDewPro
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      # Espressif's Rust fork, the only one with an Xtensa backend. Also
      # installs ldproxy, the linker wrapper that esp-idf-sys needs.
      - uses: esp-rs/xtensa-toolchain@v1.6
        with:
          default: true
          buildtargets: esp32s3
          ldproxy: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: firmware/pulsardewpro

      # embuild clones and builds ESP-IDF here; slow on a cold cache.
      - name: Cache ESP-IDF
        uses: actions/cache@v4
        with:
          path: firmware/pulsardewpro/.embuild
          key: espidf-v5.4-${{ runner.os }}

      - name: Check formatting
        working-directory: firmware/pulsardewpro
        run: cargo fmt --check

      - name: Clippy
        working-directory: firmware/pulsardewpro
        run: cargo clippy --release -- -D warnings

      - name: Build firmware
        working-directory: firmware/pulsardewpro
        run: cargo build --release

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: pulsardewpro-firmware
          path: firmware/pulsardewpro/target/xtensa-esp32s3-espidf/release/pulsardewpro
          retention-days: 30
