# Dependabot configuration for pulsarfab
# Automatically updates dependencies across the repository

version: 2
updates:
  # Update Cargo dependencies. Each firmware target is its own package rather
  # than one workspace, so each needs listing.
  - package-ecosystem: "cargo"
    directories:
      - "/firmware/shared"
      - "/firmware/pulsardew"
      - "/firmware/crunchdefender"
      - "/firmware/pulsardewpro"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "deps"
      include: "scope"
    open-pull-requests-limit: 5

  # Update GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
      include: "scope"
    open-pull-requests-limit: 5
